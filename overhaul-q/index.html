<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คำถามระบบ Overhaul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column questionnaire · sticky progress bar · each question a card with big tap targets */
:root{
  --bg:#f3f5f8; --paper:#fff; --ink:#17212b; --muted:#5b6876; --line:#d9e0e7;
  --accent:#7a1fa2; --accent-soft:#f4e9fa; --accent-ink:#fff; --ok:#11804a; --err:#c4320a;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121519; --paper:#1b2027; --ink:#e8edf2; --muted:#9ba7b4; --line:#2e3742;
  --accent:#c77ee6; --accent-soft:#33213d; --accent-ink:#1a0f20; --ok:#5ad08f; --err:#ff8a65; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.who{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:18px;margin:12px 0 0;color:var(--accent)}
.q{display:flex;flex-direction:column;gap:10px}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;min-width:34px;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.q.done .num{background:var(--accent);color:var(--accent-ink)}
.qt{margin:4px 0 0;font-weight:600;min-width:0}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{color:var(--accent);margin-right:4px}
.extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:40px}
.extra input{max-width:140px}
.extra input.wide{max-width:none;flex:1 1 240px}
.notebtn{align-self:flex-start;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;padding:0;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.send{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:11px 24px;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:14px;margin:0}
.msg.err{color:var(--err)}
.thanks{display:flex;flex-direction:column;gap:12px}
.thanks h2{color:var(--ok);margin:0}
pre.sum{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);background:var(--bg);border-radius:10px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;font:inherit;padding:9px 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>คำถามระบบ Overhaul</h1>
  <p class="lead">เลือกคำตอบได้เลย ไม่ต้องตอบครบทุกข้อ ข้อไหนไม่แน่ใจข้ามได้ หรือพิมพ์อธิบายในหมายเหตุ · ระบบจำคำตอบที่เลือกไว้ในเครื่องนี้ ปิดแล้วกลับมาทำต่อได้</p>
  <div class="card who">
    <label class="f" for="name">ชื่อผู้ตอบ <small>ชื่อเล่นหรือชื่อ-ตำแหน่ง เพื่อให้ทีมติดต่อกลับได้</small>
      <input type="text" id="name" maxlength="120" autocomplete="name" placeholder="เช่น สมชาย · หัวหน้าแผนก กบค.">
    </label>
    <label class="f" for="team">ตอบในนาม
      <select id="team"></select>
    </label>
  </div>
  <div id="form"></div>
  <div class="card thanks" id="done" hidden>
    <h2>ส่งคำตอบแล้ว ขอบคุณครับ/ค่ะ</h2>
    <p class="msg">สรุปคำตอบของคุณ (คัดลอกเก็บไว้ หรือส่งในไลน์ก็ได้)</p>
    <pre class="sum" id="sum"></pre>
    <div class="row">
      <button type="button" class="ghost" id="copysum">คัดลอกสรุป</button>
      <button type="button" class="ghost" id="again">แก้คำตอบแล้วส่งใหม่</button>
    </div>
  </div>
</div>
<div class="bar"><div class="in">
  <span class="prog" id="prog">ตอบแล้ว 0 ข้อ</span>
  <p class="msg err" id="err" hidden></p>
  <button type="button" class="send" id="send" disabled>ส่งคำตอบ</button>
</div></div>
<script src="../config.js"></script>
<script src="qdata.js"></script>
<script>
(function(){
  const L=['ก','ข','ค','ง','จ'];
  const KEY='oh-q-draft-v1';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let st={name:'',team:'customer',a:{}};
  try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.a) st=Object.assign(st,s); }catch{}
  const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(st))}catch{} };
  const teamSel=$('team');
  Object.entries(OH_TEAMS).forEach(([k,v])=>teamSel.add(new Option(v,k)));
  teamSel.value=st.team; $('name').value=st.name;
  const secs=()=>OH_Q.filter(s=>s.team===st.team);
  const A=n=>(st.a[n]=st.a[n]||{c:[],f:{},o:'',x:''});
  const answered=n=>{ const a=st.a[n]; return !!a && (a.c.length||a.o.trim()||Object.values(a.f).some(v=>String(v).trim())||a.x.trim()); };

  function render(){
    const box=$('form'); box.innerHTML='';
    secs().forEach(sec=>{
      const h=document.createElement('h2'); h.textContent=sec.sec; box.appendChild(h);
      sec.items.forEach(it=>{
        const a=A(it.n), t=it.t||'one';
        const card=document.createElement('section'); card.className='card q'; card.id='q'+it.n;
        let html=`<div class="qh"><span class="num">${it.n}</span><p class="qt">${esc(it.q)}${t==='multi'?' <span class="hint">(เลือกได้หลายข้อ)</span>':''}</p></div>`;
        if(it.o){
          html+='<div class="opts">';
          const opts=[...it.o, ...(it.other?['อื่น ๆ (ระบุ)']:[])];
          opts.forEach((o,i)=>{
            const id=`q${it.n}o${i}`, on=a.c.includes(L[i]);
            html+=`<label class="opt" for="${id}"><input type="${t==='multi'?'checkbox':'radio'}" name="q${it.n}" id="${id}" value="${L[i]}" ${on?'checked':''}><span><b>${it.n}${L[i]}.</b>${esc(o)}</span></label>`;
            if(it.blank&&it.blank.on===i) html+=`<div class="extra" data-show="${L[i]}" ${on?'':'hidden'}><input type="number" min="0" inputmode="numeric" id="q${it.n}b" aria-label="${esc(it.blank.label)}" value="${esc(a.f.b||'')}"> <span>${esc(it.blank.unit)}</span></div>`;
            if(it.other&&i===opts.length-1) html+=`<div class="extra" data-show="${L[i]}" ${on?'':'hidden'}><input type="text" class="wide" id="q${it.n}x2" maxlength="300" aria-label="ระบุ" placeholder="ระบุ" value="${esc(a.o)}"></div>`;
          });
          html+='</div>';
        }
        if(it.fields){
          html+='<div class="opts">'+it.fields.map((f,i)=>`<div class="extra" style="padding-left:0"><label for="q${it.n}f${i}" style="min-width:150px">${esc(f.label)}</label><input ${f.wide?'type="text" class="wide" maxlength="500"':'type="number" min="0" inputmode="numeric"'} id="q${it.n}f${i}" value="${esc(a.f[i]||'')}"> <span>${esc(f.unit)}</span></div>`).join('')+'</div>';
        }
        html+=`<button type="button" class="notebtn" data-n="${it.n}" ${a.x?'hidden':''}>+ เพิ่มหมายเหตุ</button><textarea id="q${it.n}x" maxlength="1000" placeholder="หมายเหตุ (ถ้ามี)" ${a.x?'':'hidden'} aria-label="หมายเหตุข้อ ${it.n}">${esc(a.x)}</textarea>`;
        card.innerHTML=html; box.appendChild(card);
        // wiring
        card.querySelectorAll(`input[name=q${it.n}]`).forEach(inp=>inp.addEventListener('change',()=>{
          a.c=[...card.querySelectorAll(`input[name=q${it.n}]:checked`)].map(x=>x.value);
          card.querySelectorAll('.extra[data-show]').forEach(e=>e.hidden=!a.c.includes(e.dataset.show));
          upd();
        }));
        const b=card.querySelector(`#q${it.n}b`); if(b) b.addEventListener('input',()=>{a.f.b=b.value;upd()});
        const o=card.querySelector(`#q${it.n}x2`); if(o) o.addEventListener('input',()=>{a.o=o.value;upd()});
        (it.fields||[]).forEach((_,i)=>{const f=card.querySelector(`#q${it.n}f${i}`); f.addEventListener('input',()=>{a.f[i]=f.value;upd()})});
        const nb=card.querySelector('.notebtn'), ta=card.querySelector(`#q${it.n}x`);
        nb.addEventListener('click',()=>{nb.hidden=true;ta.hidden=false;ta.focus()});
        ta.addEventListener('input',()=>{a.x=ta.value;upd()});
      });
    });
    upd();
  }
  function items(){ return secs().flatMap(s=>s.items); }
  function upd(){
    const its=items(), n=its.filter(i=>answered(i.n)).length;
    its.forEach(i=>{const c=$('q'+i.n); if(c) c.classList.toggle('done',answered(i.n))});
    $('prog').textContent=`ตอบแล้ว ${n} จาก ${its.length} ข้อ`;
    $('send').disabled=!(st.name.trim()&&n>0);
    save();
  }
  function summary(){
    return items().filter(i=>answered(i.n)).map(i=>{
      const a=st.a[i.n]; let s=String(i.n)+a.c.join(',');
      const extra=[a.f.b?`${a.f.b}${i.blank?i.blank.unit:''}`:'', ...(i.fields||[]).map((f,k)=>a.f[k]?`${f.label} ${a.f[k]}${f.unit?' '+f.unit:''}`:''), a.o, a.x].filter(Boolean);
      return extra.length? `${s} (${extra.join(' · ')})` : s;
    }).join('\n');
  }
  $('name').addEventListener('input',e=>{st.name=e.target.value;upd()});
  teamSel.addEventListener('change',e=>{st.team=e.target.value;render();scrollTo(0,0)});
  $('send').addEventListener('click',async()=>{
    const btn=$('send'), err=$('err'); err.hidden=true;
    const cfg=window.RETRO_CONFIG||{};
    const its=items(), ans={};
    its.forEach(i=>{ if(answered(i.n)) ans[i.n]=st.a[i.n]; });
    const body={name:st.name.trim(),team:OH_TEAMS[st.team],answers:ans,summary:summary()};
    btn.disabled=true; btn.textContent='กำลังส่ง…';
    try{
      const r=await fetch(cfg.supabaseUrl+'/rest/v1/oh_answers',{method:'POST',headers:{apikey:cfg.supabaseKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
      if(!r.ok) throw new Error(r.status);
      $('sum').textContent=`${body.name} · ${body.team}\n`+body.summary;
      $('form').hidden=true; document.querySelector('.who').hidden=true; $('done').hidden=false; scrollTo(0,0);
    }catch(e){ err.textContent='ส่งไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วกดส่งอีกครั้ง คำตอบยังอยู่ครบ'; err.hidden=false; }
    finally{ btn.textContent='ส่งคำตอบ'; upd(); }
  });
  $('copysum').addEventListener('click',async()=>{ const t=$('sum').textContent; try{await navigator.clipboard.writeText(t);$('copysum').textContent='คัดลอกแล้ว ✓'}catch{const r=document.createRange();r.selectNodeContents($('sum'));getSelection().removeAllRanges();getSelection().addRange(r)} });
  $('again').addEventListener('click',()=>{ $('done').hidden=true; $('form').hidden=false; document.querySelector('.who').hidden=false; scrollTo(0,0); });
  render();
})();
</script>
</body>
</html>
